
<!DOCTYPE html>
<html lang="en">

<body>
    <header>
		<head>
			<link rel ="stylesheet" href="#">
			<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=2.0">
			<title>Net Banking User Panel</title>
			<style>
				body {
                    font-family: Arial, sans-serif;
                    margin: 0;
                    padding: 0;
                }

                .navbar {
                    background-color:#03045e;
                    color: #fff;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding:5px;    
                }

                .navbar-brand .navbar-logo {
                    font-size:25px;
                    color: #fff;
                    text-decoration: none;
                    font-weight: bold;
                    padding-left: 50px;
                }

                .navbar-brand .navbar-logo span{
                    color:#00b4d8;
                }
                .navbar-menu {
                    list-style: none;
                    display: flex;
                }

                .navbar-item {
                    margin-left: 30px;
                }

                .navbar-item a {
                    color: #fff;
                    text-decoration: none;
                    font-weight: 500;
                    font-size:15px;
                }

                .navbar-item a:hover {
                    color: #90e0ef;
                    text-decoration: underline;
                }
                footer {
                    display: flex;
                    flex-direction: column;
                    text-align: center;
                    justify-content: center;
                    background-color:#03045e;
                    color: #fff;
                    text-align: center;
                    width: 100%;
                }
                .footer1 a {
                    color: #fff;
                    text-decoration: none;
                    font-size:10px;
                    font-weight:500;
                    padding: 20px 20px;
                }

                .footer2 span {
                    color: #fff;
                    font-size:20px;
                    font-weight:500;
                    text-decoration: none;
                    padding-top:20px ;
                }

                main {
                    display: flex;
                    flex-direction: row;
                    align-items: center;
                    padding: 4em;
                    background-color: lightblue;
                    color: #2c2929;
                }
                .dashboard {
                    background-color: #f7f7f7;
                    padding: 4em;
                    border: 1px solid #ddd;
                    border-radius: 10px;
                    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    
                }

                .stats {
                    display: flex;
                    justify-content: space-between;
                    margin-bottom: 20px;
                }

                .stat {
                    background-color: #fff;
                    padding: 12px;
    
                }
                
                .transactions{
                    background-color: #f7f7f7;
                    padding: 2em;
                    border: 1px solid #ddd;
                    border-radius: 10px;
                    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                    width: 1000px;
                    margin: 1.2rem;
                }
                .showtransactions{
                    background-color: #f7f7f7;
                    padding: 2em;
                    border: 1px solid #ddd;
                    border-radius: 10px;
                    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                    width: 1000px;
                    margin: 1.2rem;
                }
                .usercomplaint{
                    background-color: #f7f7f7;
                    padding: 2em;
                    border: 1px solid #ddd;
                    border-radius: 10px;
                    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                    width: 1000px;
                    margin: 1.2rem;
                }
                .balance_quary{
                    background-color: #f7f7f7;
                    padding: 2em;
                    border: 1px solid #ddd;
                    border-radius: 10px;
                    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                    width: 1000px;
                    margin: 1.2rem;
                }
			</style>
