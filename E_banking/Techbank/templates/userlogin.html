
<!DOCTYPE html>

	content="width=device-width, initial-scale=1.0"> 
<title>Sign IN</title>
<style>
.navbar {
    background-color:#03045e;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding:5px;
    
}

.navbar-brand .navbar-logo {
    font-size:25px;
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    padding-left: 50px;
}

.navbar-brand .navbar-logo span{
    color:#00b4d8;
}
.navbar-menu {
    list-style: none;
    display: flex;
}

.navbar-item {
    margin-left: 30px;
}

.navbar-item a {
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    font-size:15px;
}

.navbar-item a:hover {
    color: #90e0ef;
    text-decoration: underline;
}
footer {
    display: flex;
    flex-direction: column;
    text-align: center;
    justify-content: center;
    background-color:#03045e;
    color: #fff;
    text-align: center;
    width: 100%;
	height:30px;
}
.footer1 a {
    color: #fff;
    text-decoration: none;
    font-size:15px;
    font-weight:500;
    padding: 20px 20px;
}

.footer2 span {
    color: #fff;
    font-size:20px;
    font-weight:500;
    text-decoration: none;
    padding-top:20px ;
}

	*{ 
	margin: 0; 
	padding: 0; 
	box-sizing: border-box; 
	border: none; 
	outline: none; 
	font-family: 'Poppins', sans-serif;  
	transition: all 0.2s linear; 
} 

.container { 
	display: flex; 
	justify-content: center; 
	align-items: center; 
	min-height:90vh; 
	padding: 25px; 
	background: #d6eef1; 
} 

.container form { 
	width: 700px; 
	height: 350px;
	padding: 20px; 
	background: #fff; 
	box-shadow: 5px 5px 30px rgba(0, 0, 0, 0.2); 
} 

.container form .row { 
	display: flex; 
	flex-wrap: wrap; 
	gap: 15px; 
} 

.container form .row .col { 
	flex: 1 1 250px; 
} 

.col .title { 
	font-size: 20px; 
	color: rgb(237, 55, 23); 
	padding-bottom: 5px; 
} 

.col .inputBox { 
	margin: 15px 0; 
} 

.col .inputBox label { 
	margin-bottom: 10px; 
	display: block; 
} 

.col .inputBox input, 
.col .inputBox select { 
	width: 100%; 
	border: 1px solid #ccc; 
	padding: 10px 15px; 
	font-size: 15px; 
} 

.col .inputBox input:focus, 
.col .inputBox select:focus { 
	border: 1px solid #000; 
} 

.col .flex { 
	display: flex; 
	gap: 15px; 
} 

.col .flex .inputBox { 
	flex: 1 1; 
	margin-top: 5px; 
} 

.col .inputBox img { 
	height: 34px; 
	margin-top: 5px; 
	filter: drop-shadow(0 0 1px #000); 
} 

.container form .submit_btn { 
	width: 100%; 
	padding: 12px; 
	font-size: 17px; 
	background: rgb(1, 143, 34); 
	color: #fff; 
	margin-top: 5px; 
	cursor: pointer; 
	letter-spacing: 1px; 
} 

.container form .submit_btn:hover { 
	background: #3d17fb; 
} 

input::-webkit-inner-spin-button, 
input::-webkit-outer-spin-button { 
	display: none; 
}
</style> 
</head> 

<nav class="navbar">
	<div class="navbar-brand">
		<a href="home" class="navbar-logo">TECH <span>BANK</span></a>
	</div>
		<ul class="navbar-menu">
			<li class="navbar-item"><a href="home">Home</a></li>
			<li class="navbar-item"><a href="{% url 'logout' %}">Signup</a></li>
			<li class="navbar-item"><a href="#"></a></li>
		</ul>
</nav>
</header>

<body> 
	<div class="container"> 

		<form action="userlog"> 

			<div class="row"> 

				<div class="col"> 
					<h3 class="title"> 
						Sign In 
					</h3> 

					<div class="inputBox"> 
						<label for="Email"> 
							Email 
						</label> 
						<input type="email" id="email" name="email"
							placeholder="Enter your email"
							required> 
					</div> 


					<div class="inputBox"> 
						<label for="Enter Password"> 
							Enter Password 
						</label> 
						<input type="password" id="Password" name="Password"
							placeholder="Enter Your Password"
							required> 
					</div>

				</div> 

			</div> 

			<input type="submit" value="Sign In"
				class="submit_btn"> 
                <p>Not a User?
                    <a href="#"
                       style="text-decoration: none;">
                       <a href="Reg">Sign Up</a>
                    </a>
					
              </p>
		</form> 
       

	</div> 
</body>
